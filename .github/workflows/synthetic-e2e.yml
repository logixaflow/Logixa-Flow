name: The Nexus Suite - Synthetic E2E AI Smoke Tests

on:
  schedule:
    # Run every day at 03:00 UTC (09:30 MMT)
    - cron: "0 3 * * *"
  workflow_dispatch:

concurrency:
  group: nexus-e2e-${{ github.workflow }}
  cancel-in-progress: true

jobs:
  synthetic-e2e:
    name: Run AI Feature Smoke Tests
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Run Synthetic AI Feature E2E Smoke Tests
        shell: bash
        run: |
          cat << 'EOF' > /tmp/nexus_e2e.py
          import urllib.request, json, time, sys

          TESTS_PASSED = 0
          TESTS_FAILED = 0
          FAILURES = []

          def run_test(name, fn):
              global TESTS_PASSED, TESTS_FAILED
              print(f"  ▶️  {name}...", end=" ", flush=True)
              try:
                  ok, msg = fn()
                  if ok:
                      TESTS_PASSED += 1
                      print(f"[PASSED]")
                      print(f"      ↳ {msg}")
                  else:
                      TESTS_FAILED += 1
                      FAILURES.append((name, msg))
                      print(f"[FAILED]")
                      print(f"      ↳ {msg}")
              except Exception as e:
                  TESTS_FAILED += 1
                  FAILURES.append((name, str(e)))
                  print(f"[ERROR] {e}")

          def test_auracraft_tts():
              url = "https://auracraft-backend-dt1u.onrender.com/api/tts/synthesize"
              body = json.dumps({"text": "မင်္ဂလာပါ The Nexus Suite မှ ကြိုဆိုပါတယ်", "voice": "my-MM-NilarNeural"}).encode("utf-8")
              req = urllib.request.Request(url, data=body, headers={
                  "Content-Type": "application/json",
                  "Origin": "https://auracraft-studio.vercel.app",
                  "User-Agent": "Mozilla/5.0"
              }, method="POST")
              with urllib.request.urlopen(req, timeout=30) as r:
                  audio = r.read()
                  ctype = r.headers.get("Content-Type", "")
                  ok = r.status == 200 and len(audio) > 5000 and "audio" in ctype
                  return ok, f"HTTP {r.status}, {len(audio)/1024:.1f} KB {ctype}"

          def test_auracraft_vrm():
              req = urllib.request.Request(
                  "https://auracraft-studio.vercel.app/models/avatar_female_a.vrm",
                  headers={"User-Agent": "Mozilla/5.0", "Range": "bytes=0-2048"}
              )
              with urllib.request.urlopen(req, timeout=20) as r:
                  chunk = r.read()
                  return r.status in [200, 206] and len(chunk) > 500, f"HTTP {r.status}, {len(chunk)} bytes"

          def test_narrativ_ready():
              req = urllib.request.Request("https://narrativ-forge.onrender.com/api/v1/ready", headers={"User-Agent": "Mozilla/5.0"})
              with urllib.request.urlopen(req, timeout=30) as r:
                  data = json.loads(r.read())
                  checks = data.get("checks", {})
                  ok = data.get("status") == "ready" and checks.get("database") == "ok"
                  return ok, f"status={data.get('status')}, DB={checks.get('database')}, Redis={checks.get('redis')}"

          def test_cognix_ready():
              req = urllib.request.Request("https://cognix-core-ypak.onrender.com/ready", headers={"User-Agent": "Mozilla/5.0"})
              with urllib.request.urlopen(req, timeout=20) as r:
                  data = json.loads(r.read())
                  return r.status == 200, f"HTTP {r.status}, status={data.get('status')}"

          def test_doka_worker():
              req = urllib.request.Request("https://doka-ai-dms.logixaflow.workers.dev/health", headers={"User-Agent": "Mozilla/5.0"})
              with urllib.request.urlopen(req, timeout=15) as r:
                  data = json.loads(r.read())
                  return r.status == 200, f"HTTP {r.status}, {data.get('status', 'ok')}"

          def test_alw_health():
              req = urllib.request.Request("https://a-little-world-with-us.vercel.app/api/health", headers={"User-Agent": "Mozilla/5.0"})
              with urllib.request.urlopen(req, timeout=15) as r:
                  return r.status == 200, f"HTTP {r.status}"

          def test_logixa_health():
              req = urllib.request.Request("https://logixa-flow.onrender.com/health", headers={"User-Agent": "Mozilla/5.0"})
              with urllib.request.urlopen(req, timeout=20) as r:
                  return r.status == 200, f"HTTP {r.status}"

          print("=" * 70)
          print(" Nexus Suite - Synthetic E2E AI Feature Smoke Tests")
          print("=" * 70)

          run_test("[AuraCraft] Edge-TTS Burmese Voice Generation (20KB MP3)", test_auracraft_tts)
          run_test("[AuraCraft] 3D VRM Avatar Asset Streaming", test_auracraft_vrm)
          run_test("[Narrativ-Forge] Backend Ready (DB + Redis verified)", test_narrativ_ready)
          run_test("[Cognix-Nexus] Core Engine Readiness", test_cognix_ready)
          run_test("[Doka-AI-DMS] Cloudflare OCR Worker", test_doka_worker)
          run_test("[A-Little-World] Next.js Fullstack API", test_alw_health)
          run_test("[Logixa-Flow] Supply Chain Backend", test_logixa_health)

          total = TESTS_PASSED + TESTS_FAILED
          print()
          print("-" * 70)
          print(f" RESULTS: {TESTS_PASSED}/{total} Passed")
          if FAILURES:
              print(f" FAILURES ({TESTS_FAILED}):")
              for name, msg in FAILURES:
                  print(f"  ❌ {name}: {msg}")
              sys.exit(1)
          else:
              print(" 🎉 ALL TESTS PASSED - Nexus Suite AI Features Fully Operational!")
          print("=" * 70)
          EOF
          python /tmp/nexus_e2e.py
